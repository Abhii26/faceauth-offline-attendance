name: face_auth
description: >-
  Offline, liveness-protected face attendance app. On-device MobileFaceNet
  embeddings, active + passive anti-spoofing, SQLite audit log and CSV export.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image: ^3.3.0
  path_provider: ^2.0.15
  google_mlkit_face_detection: ^0.10.0
  tflite_flutter: ^0.12.1
  shared_preferences: ^2.2.2
  camera: ^0.10.5+9
  sqflite: ^2.3.0
  path: ^1.9.0
  face_anti_spoofing_detector: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - assets/models/mobilefacenet_ente_web.tflite
    - assets/models/liveness.tflite
